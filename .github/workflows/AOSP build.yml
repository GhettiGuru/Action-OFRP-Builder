name: OrangeFox AOSP BUILD

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (e.g., twrp_nx729j or aosp_arm64)'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT:
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'
      BUILD_TARGET:
        description: 'BUILD_TARGET (e.g., recovery, boot, vendor_boot)'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OF_VERSION: R12.1
      SYNC_URL: ${{ github.event.inputs.SYNC_URL }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
      DEVICE_NAME: ''
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
      BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Initialize workspace
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

      - name: Derive DEVICE_NAME from MAKEFILE_NAME
        run: |
          DERIVED_DEVICE_NAME=$(echo "${{ env.MAKEFILE_NAME }}" | sed 's/^twrp_//')
          echo "DEVICE_NAME=$DERIVED_DEVICE_NAME" >> $GITHUB_ENV

      - name: Clean Preinstalled Tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/node_modules ~/.npm
          sudo rm -rf /opt/hostedtoolcache/Python ~/.cache/pip
          docker system prune -a -f
          sudo apt clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Clean up pre-installed software and free disk space (Aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true
          swap-storage: true
          apt: true
          npm: true

      - name: Prepare the build environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq linux-modules-extra-$(uname -r) git python3 tar aria2 git dos2unix gh repo
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ env.MANIFEST_BRANCH }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            ofrp-repo-${{ env.MANIFEST_BRANCH }}-
            ofrp-repo-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEVICE_NAME }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.DEVICE_NAME }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=~/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          ccache -s

      - name: Sync OrangeFox Sources
        run: |
          set -xe
          BUILD_DIR="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          TEMP_MANIFEST_TOOLS_DIR="${{ steps.pwd.outputs.workspace-folder }}/temp_manifest_tools"
          mkdir -p "$BUILD_DIR"
          git clone --depth=1 "${{ env.SYNC_URL }}" "$TEMP_MANIFEST_TOOLS_DIR"
          cd "$TEMP_MANIFEST_TOOLS_DIR"
          ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path "$BUILD_DIR"
          rm -rf "$TEMP_MANIFEST_TOOLS_DIR"
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        
##initial sync without cache enable this by deleteing # on steps
     # - name: Save OrangeFox .repo Cache
      #  if: success()
       # id: save-ofrp
        # uses: actions/cache/save@v4
      #  with:
        #  path: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/.repo
         # key: ofrp-repo-${{ env.MANIFEST_BRANCH }}-${{ hashFiles('build.sh') }}

      - name: Save ccache
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ env.DEVICE_NAME }}-${{ hashFiles('build.sh') }}

      - name: Clone device tree
        run: |
          BUILD_ROOT="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          TARGET_DIR="$BUILD_ROOT/${{ env.DEVICE_PATH }}" # This is the final location

          echo "Ensuring target directory '$TARGET_DIR' exists."
          mkdir -p "$TARGET_DIR" || {
              echo "❌ Error: Failed to create target directory $TARGET_DIR."
              exit 1
          }

          echo "Cloning device tree from ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} into $TARGET_DIR..."
          git clone --depth=1 "${{ env.DEVICE_TREE_URL }}" -b "${{ env.DEVICE_TREE_BRANCH }}" "$TARGET_DIR" || {
              echo "❌ Error: Failed to clone device tree into $TARGET_DIR."
              exit 1
          }

          echo "Device tree should now be at: $TARGET_DIR"
          ls -la "$TARGET_DIR" # Check what's actually there

        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        
      - name: Clone common tree (if provided)
        if: ${{ env.COMMON_TREE_URL != '' && env.COMMON_PATH != '' }}
        run: |
          git clone ${{ env.COMMON_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.COMMON_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}

      - name: Patch envsetup.sh for compatibility
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/build
          dos2unix envsetup.sh || true
          sed -i '/echo \[DEBUG\]/d' envsetup.sh || true
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' envsetup.sh || true
          sed -i '/^        fi$/a\        version=${variant}' envsetup.sh

      - name: Inject Debugging into envsetup.sh
        run: |
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          sed -i '/\[ -s "\$T\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: Checking Android.mk..."' \
          "$BUILD_TOP_PATH/build/envsetup.sh"

      - name: Building Recovery (Main Device Build)
        continue-on-error: true
        if: ${{ env.MAKEFILE_NAME != 'aosp_arm64' }}
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          touch build.log
          exec > >(tee -a build.log) 2>&1
          set +e
          source build/envsetup.sh
          source vendor/twrp/build/envsetup.sh || true
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR=$(pwd)/out
          export OUT=$OUT_DIR
          lunch ${{ env.MAKEFILE_NAME }}-${{ env.BUILD_VARIANT }} || exit 1
          make clean && mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all) || exit 1

      - name: Building Recovery (AOSP Arm64 Test)
        continue-on-error: true
        run: |
          set -xeuo pipefail
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          touch build.log
          exec > >(tee -a build.log) 2>&1
          set +u
          source build/envsetup.sh
          source vendor/twrp/build/envsetup.sh || true
          set -u
          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR=$(pwd)/out
          export OUT=$OUT_DIR
          lunch aosp_arm64-eng || exit 1
          make -j$(nproc) recoveryimage || exit 1

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/*/recovery.img

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/build.log

      - name: Show ccache stats
        if: always()
        run: ccache -s || echo "⚠️ ccache not installed or failed"

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.img
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          name: OrangeFox-${{ env.DEVICE_NAME }}-${{ env.OF_VERSION }}-${{ github.run_id }}
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.OF_VERSION }}-${{ github.run_id }}
          body: |
            OrangeFox Recovery Build

            **Build Details:**
            - **Manifest URL:** `${{ env.SYNC_URL }}`
            - **Manifest Branch:** `${{ env.MANIFEST_BRANCH }}`
            - **Device:** `${{ env.DEVICE_NAME }}`
            - **Device Tree:** `${{ env.DEVICE_TREE_URL }} (Branch: ${{ env.DEVICE_TREE_BRANCH }})`
            - **Build Variant:** `${{ env.BUILD_VARIANT }}`
            - **Build Target:** `${{ env.BUILD_TARGET }}`

            Generated on ${{ github.event.repository.name }} at workflow run #${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('🧪 OrangeFox Recovery Build Summary')
              .addTable([
                ['Key', 'Value'],
                ['Device', process.env.DEVICE_NAME],
                ['Branch', process.env.MANIFEST_BRANCH],
                ['Target', process.env.BUILD_TARGET],
                ['Success', '${{ job.status }}'],
              ])
              .addLink('🔗 Download Artifacts', `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`)
              .write()

      - name: ✅ Done
        if: always()
        run: echo "Build process completed (success or fail). Check artifacts above."
