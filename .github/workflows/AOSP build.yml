name: OrangeFox AOSP BUILD
on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      MAKEFILE_NAME: # Input #8
        description: 'MAKEFILE_NAME (e.g., twrp_nx729j or aosp_arm64)'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT: # Input #9
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'
      BUILD_TARGET: # Input #10 - Added for main workflow compatibility
        description: 'BUILD_TARGET (e.g., recovery, boot, vendor_boot)'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OF_VERSION: R12.1
      SYNC_URL: ${{ github.event.inputs.SYNC_URL }} # This will be ignored by orangefox_sync.sh
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
      DEVICE_NAME: '' # Placeholder, will be derived
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
      BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Initialize workspace
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          
      - name: Derive DEVICE_NAME from MAKEFILE_NAME
        run: |
          DERIVED_DEVICE_NAME=$(echo "${{ env.MAKEFILE_NAME }}" | sed 's/^twrp_//')
          echo "Derived DEVICE_NAME: $DERIVED_DEVICE_NAME"
          echo "DEVICE_NAME=$DERIVED_DEVICE_NAME" >> $GITHUB_ENV

      - name: Prepare the build environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              linux-modules-extra-$(uname -r) \
              git python3 tar aria2
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      
      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ env.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-
      
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE_NAME }}-
      - name: Configure ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
      - name: Check & Free Disk Space
        run: |
          echo "📦 Disk usage BEFORE cleanup:"
          df -h /
          echo ""
          echo "🔍 Searching for .tzst repo cache archives in /home/runner/work/_temp..."
          ARCHIVES=$(find /home/runner/work/_temp -type f -name '*.tzst')
          if [ -z "$ARCHIVES" ]; then
            echo "✅ No .tzst repo cache archive found by this script — nothing to delete."
          else
            echo "🗑️ Found the following archive(s) to delete:"
            echo "$ARCHIVES"
            echo ""
            echo "$ARCHIVES" | xargs rm -f
            echo "✅ Deleted repo cache archive(s)."
          fi
          echo ""
          echo "📦 Disk usage AFTER cleanup (by this step):"
          df -h /

      # REPLACED: Old 'Conditionally Sync OrangeFox Sources' step
      # This new step correctly calls orangefox_sync.sh which handles init/sync
      - name: Sync OrangeFox Sources
        run: |
          # The orangefox_sync.sh script was cloned into workspace/scripts by "Prepare the build environment"
          # We execute it from there, and tell it where to place the synced files.
          cd ${{ steps.pwd.outputs.workspace-folder }}/scripts
          echo "Running orangefox_sync.sh with branch ${{ env.MANIFEST_BRANCH }}"
          ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path ../fox_${{ env.MANIFEST_BRANCH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/scripts # Explicitly set working directory

      - name: Clone device tree
        run: |
          git clone ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }} # Corrected working directory

      - name: Clone common tree (if provided)
        if: ${{ env.COMMON_TREE_URL != '' && env.COMMON_PATH != '' }}
        run: |
          git clone ${{ env.COMMON_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.COMMON_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }} # Corrected working directory

      - name: Debug envsetup.sh around line 722
        run: |
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          echo "Content of $BUILD_TOP_PATH/build/envsetup.sh around line 722:"
          sed -n '710,730p' "$BUILD_TOP_PATH/build/envsetup.sh"
          echo "--- End of envsetup.sh snippet ---"
        continue-on-error: true

      - name: Patch envsetup.sh for compatibility
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/build
          echo "🔧 Patching envsetup.sh"
          dos2unix envsetup.sh || true
          sed -i '/echo \[DEBUG\]/d' envsetup.sh || true
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' envsetup.sh || true
          
          # --- PATCH FOR 'version: unbound variable' (consolidated here) ---
          echo "Applying 'version=${variant}' patch to build/envsetup.sh..."
          sed -i '/^        fi$/a\        version=${variant}' envsetup.sh
          # --- END PATCH ---

      - name: Inject Debugging into envsetup.sh
        run: |
          set -x
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          sed -i '/\[ -s "\$T\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: (build/envsetup.sh) Checking Android.mk:" >&2;
