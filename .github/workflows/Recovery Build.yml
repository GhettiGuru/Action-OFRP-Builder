name: OrangeFox Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'twrp_nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT:
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OF_VERSION: R12.1
      SYNC_URL: ${{ github.event.inputs.SYNC_URL }}
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
      BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clean Preinstalled Tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt full-upgrade -y && sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk \
            aria2 repo gh git dos2unix

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set Up Workspace
        id: pwd
        run: |
          mkdir -p workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT
          
      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Check & Free Disk Space (separate step for visibility)
        # This step now stands alone to ensure its output is directly visible in the UI
        run: |
          echo "📦 Disk usage BEFORE cleanup:"
          df -h /

          echo ""
          echo "🔍 Searching for .tzst repo cache archives in /home/runner/work/_temp..."
          # The actions/cache typically deletes its own archives after restore.
          # This is a defensive check for any remaining ones.
          ARCHIVES=$(find /home/runner/work/_temp -type f -name '*.tzst')

          if [ -z "$ARCHIVES" ]; then
            echo "✅ No .tzst repo cache archive found by this script — nothing to delete."
          else
            echo "🗑️ Found the following archive(s) to delete:"
            echo "$ARCHIVES"
            echo ""
            echo "$ARCHIVES" | xargs rm -f
            echo "✅ Deleted repo cache archive(s)."
          fi

          echo ""
          echo "📦 Disk usage AFTER cleanup (by this step):"
          df -h /

      - name: Conditionally Sync OrangeFox Sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}

          if [ -f fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo/manifest.xml ]; then
            echo "🟢 .repo cache found - using orangefox_sync.sh for resync"
            git clone --depth=1 ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ../fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "🔴 .repo cache NOT found - full repo init/sync"
            mkdir -p fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} || {
              echo "❌ Repo init failed - branch may not exist"
              exit 1
            }
            repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc)
          fi
          
      - name: Clone device tree
        run: |
          git clone --depth=1 -b $DEVICE_TREE_BRANCH $DEVICE_TREE_URL workspace/fox_${MANIFEST_BRANCH}/$DEVICE_PATH

      - name: Clone common tree (if provided)
        if: ${{ env.COMMON_TREE_URL != '' && env.COMMON_PATH != '' }}
        run: |
          git clone --depth=1 $COMMON_TREE_URL workspace/fox_${MANIFEST_BRANCH}/$COMMON_PATH

      - name: Setup lunch combo
        run: |
          echo "LUNCH_COMBO=${DEVICE_NAME}-${BUILD_VARIANT}" >> $GITHUB_ENV

      - name: Patch envsetup.sh for compatibility
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build
          echo "🔧 Patching envsetup.sh"
          dos2unix envsetup.sh || true
          sed -i '/echo \[DEBUG\]/d' envsetup.sh || true
          # REMOVE or COMMENT OUT THE FOLLOWING LINE. This is likely the cause of the PLATFORM_VERSION issue.
          # sed -i 's/\bversion\b/${version:-unknown}/g' envsetup.sh || true
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' envsetup.sh || true

      - name: Inject Debugging into envsetup.sh
        run: |
         set -x
         BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

         sed -i '/\[ -s "\$T\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
         echo "DEBUG-INJECT: (build/envsetup.sh) Checking Android.mk:" >&2; \
         echo "DEBUG-INJECT: (build/envsetup.sh) CWD: $(pwd)" >&2; \
         echo "DEBUG-INJECT: (build/envsetup.sh) Path being checked: \$T/frameworks/base/services/core/xsd/vts/Android.mk" >&2; \
         ls -l \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Android.mk not found!" >&2; \
         echo "DEBUG-INJECT: (build/envsetup.sh) Result of -s check: $( [ -s \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
         "$BUILD_TOP_PATH/build/envsetup.sh"

          if [ -f "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh" ]; then
          sed -i '/\[ -s "\$TOP\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Checking Android.mk:" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) CWD: $(pwd)" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Path being checked: \$TOP/frameworks/base/services/core/xsd/vts/Android.mk" >&2; \
          ls -l \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Android.mk not found!" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Result of -s check: $( [ -s \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
          "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh"
         fi

      - name: Build Recovery Image
        run: |
          set -xeuo pipefail # Apply to the entire script. Keep it at the top.

          # Navigate to the workspace first
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

          # Initialize build.log before redirecting output
          touch build.log

          # Redirect all subsequent output of this step to build.log and stdout for GitHub Actions live log
          exec > >(tee -a build.log) 2>&1

          echo "Starting recovery build process..."

          # Export the desired platform version BEFORE sourcing envsetup.sh and running lunch
          # TQ1A.230205.001.A2 is for Android 13 (recommended for 12.1 branch)
          # SP2A.220305.012 is for Android 12
          export PLATFORM_VERSION=SP2A

          set +u # Temporarily disable unbound variable check as sourcing might refer to unset variables
          source build/envsetup.sh
          source vendor/twrp/build/envsetup.sh || true # Use || true to prevent job failure if vendor/twrp/build/envsetup.sh is missing
          set -u # Re-enable unbound variable check

          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR=$(pwd)/out
          export OUT=$OUT_DIR

          echo "Running lunch command: lunch ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_VARIANT }}"
          
          # --- CRITICAL ADDITIONS/CHANGES HERE ---
          # These directly address the "version: unbound variable" issue by setting related variables.
          # For 'eng' variant, TARGET_BUILD_TYPE is typically 'release' or similar, but OrangeFox's envsetup.sh
          # might be looking for a simpler definition.
          export TARGET_BUILD_TYPE=release # Or 'userdebug', 'eng' based on the specific OrangeFox envsetup.sh
          export TARGET_PLATFORM_VERSION="${PLATFORM_VERSION}" # Ensure this is set for build system's internal 'version'

          # For OrangeFox's older envsetup.sh, the 'version' variable might be directly derived from PRODUCT_VERSION_LAST_ELEMENT
          # or similar. Let's try to set a variable that corresponds to AOSP's internal versioning.
          # Since you mentioned "AOSP arm64 eng", the 'version' in envsetup.sh usually refers to the 'product_variant' part.
          # Based on your input: "AOSP arm64 eng"
          # This line below might be needed if envsetup.sh specifically expects 'version' from PRODUCT_DEVICE-BUILD_VARIANT-ARCHITECTURE
          # export version="AOSP-${PLATFORM_VERSION}-arm64-eng" # This is speculative and might need adjustment
          # OR, if envsetup.sh expects "version" to be just the build variant part like "eng"
          export version="${{ github.event.inputs.BUILD_VARIANT }}" # Set the 'version' variable to your BUILD_VARIANT directly
          # --- END CRITICAL ADDITIONS/CHANGES ---

          lunch ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_VARIANT }}

          # Check the exit code of lunch. If it failed, exit the script.
          if [ $? -ne 0 ]; then
            echo "Lunch command failed!"
            exit 1
          fi

          echo "Environment variables after lunch:"
          env | grep -E 'TARGET_PRODUCT|TARGET_BUILD_VARIANT|TARGET_DEVICE|OUT|TARGET_PLATFORM_VERSION|TARGET_BUILD_TYPE' # Added TARGET_BUILD_TYPE

          echo "Starting make recoveryimage..."
          make -j$(nproc) recoveryimage

          # Check the exit code of make. If it failed, exit the script.
          if [ $? -ne 0 ]; then
            echo "Make recoveryimage failed!"
            exit 1
          fi
          echo "Recovery image build completed."
        continue-on-error: true
        
      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/*/recovery.img

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/build.log

      - name: Show ccache stats
        if: always()
        run: |
          echo "📦 ccache summary:"
          ccache -s || echo "⚠️ ccache not installed or failed"

      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.img
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Device: ${{ env.DEVICE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('🧪 OrangeFox Recovery Build Summary')
              .addTable([
                ['Key', 'Value'],
                ['Device', process.env.DEVICE_NAME],
                ['Branch', process.env.MANIFEST_BRANCH],
                ['Success', '${{ job.status }}'],
              ])
              .addLink('🔗 Download Artifacts', `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`)
              .write()

      - name: ✅ Done
        if: always()
        run: echo "Build process completed (success or fail). Check artifacts above."
