jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore Android SDK Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/android-sdk
            /usr/local/lib/android
          key: android-sdk-${{ runner.os }}

      - name: Clean Preinstalled Tools
        run: |
          set -x
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Install Build Dependencies
        run: |
          set -x
          sudo apt update && sudo apt full-upgrade -y && sudo apt -y install \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk aria2 repo gh git

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set Up Workspace
        id: pwd
        run: |
          mkdir -p workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT


      - name: Sync OrangeFox sources and minimal manifest
        run: |
         cd ${{ steps.pwd.outputs.workspace-folder }}
         git clone ${{ github.event.inputs.SYNC_URL }} sync # Cloned into 'sync' directory
         cd sync
         ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      
      - name: Patch envsetup.sh for unbound variables
        run: |
          sed -i 's/\bversion\b/${version:-unknown}/g' \
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build/envsetup.sh
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' \
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build/envsetup.sh

      - name: Save OrangeFox .repo Cache
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Tree (if defined)
        if: github.event.inputs.COMMON_TREE_URL != ''
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

      - name: Inject Debugging into envsetup.sh
        run: |
          set -x
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          
          # Python script to inject debug lines into envsetup.sh files.
          # This approach pipes a multi-line Python script (defined with a here-document)
          # directly to python3, avoiding complex shell escaping within YAML.
          #
          # IMPORTANT: The 'EOF_PYTHON' delimiter below and its closing counterpart at the end
          # MUST be at the SAME INDENTATION LEVEL as the 'python3 - <<'EOF_PYTHON'' line itself.
          # No extra spaces before or after the closing 'EOF_PYTHON'.
          python3 - <<'EOF_PYTHON'
import sys
import os

def insert_lines_before_pattern(filepath, pattern, lines_to_insert, optional=False):
    """
    Reads a file, finds a specific pattern, and inserts lines before it.
    If optional is True, it won't raise an error if the file or pattern is not found.
    """
    try:
        if not os.path.exists(filepath):
            if optional:
                print(f"Warning: Optional file not found at {filepath}. Skipping injection.", file=sys.stderr)
                return
            else:
                raise FileNotFoundError(f"File not found at {filepath}")

        with open(filepath, 'r') as f:
            content = f.readlines()

        new_content = []
        inserted = False
        for line in content:
            # Check for the pattern. Using 'in' for simple substring match.
            # For more complex regex, import 're' and use re.search(pattern, line).
            if pattern in line and not inserted:
                # Insert lines before the pattern
                for insert_line in lines_to_insert:
                    # Ensure each inserted line ends with a newline character
                    new_content.append(insert_line.rstrip('\n') + '\n')
                inserted = True
            new_content.append(line)

        if not inserted:
            if optional:
                print(f"Warning: Pattern '{pattern}' not found in optional file '{filepath}'. Lines not inserted.", file=sys.stderr)
            else:
                print(f"Error: Pattern '{pattern}' not found in '{filepath}'. Lines not inserted.", file=sys.stderr)
                sys.exit(1) # Exit with error if pattern is mandatory and not found

        with open(filepath, 'w') as f:
            f.writelines(new_content)
        print(f"Successfully injected lines into {filepath}")

    except FileNotFoundError as e:
        # FIX: Correct indentation here
        print(f"Error: {e}", file=sys.stderr)
        sys.exit(1) # Exit with error if a mandatory file is not found
    except Exception as e:
        print(f"An unexpected error occurred: {e}", file=sys.stderr)
        sys.exit(1) # Exit with error for other exceptions

# Define the lines to insert for build/envsetup.sh
# Escaping for shell variables ($T, $(pwd)) is done here, as these strings
# will be written to the envsetup.sh file and then interpreted by the shell.
# Python string literals for these lines. Need to escape internal double quotes.
# And ensure \$ becomes \\$ for Python's string literal, so it remains \$ in the output file.
lines_to_insert_build = [
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Checking Android.mk:\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) CWD: \\$(pwd)\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Path being checked: \\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr',
    'ls -l \"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr || echo \"DEBUG-INJECT: (build/envsetup.sh) Android.mk not found or empty here!\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Result of -s check: \\$( [ -s \"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo \"TRUE\" || echo \"FALSE\" )\" >> /dev/stderr'
]

# Define the lines to insert for vendor/twrp/build/envsetup.sh
lines_to_insert_vendor = [
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Checking Android.mk:\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) CWD: \\$(pwd)\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Path being checked: \\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr',
    'ls -l \"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr || echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Android.mk not found or empty here!\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Result of -s check: \\$( [ -s \"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo \"TRUE\" || echo \"FALSE\" )\" >> /dev/stderr'
]

# Get BUILD_TOP_PATH from environment variable set by the shell
build_top_path = os.environ.get('BUILD_TOP_PATH')
if not build_top_path:
    print("Error: BUILD_TOP_PATH environment variable not set.", file=sys.stderr)
    sys.exit(1)

# Call the function for build/envsetup.sh
# The pattern for Python needs internal quotes escaped: \"
insert_lines_before_pattern(
    os.path.join(build_top_path, 'build', 'envsetup.sh'),
    '[ -s \\\"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\\\" ]',
    lines_to_insert_build
)

# Call the function for vendor/twrp/build/envsetup.sh
# This one is optional, so we pass optional=True
insert_lines_before_pattern(
    os.path.join(build_top_path, 'vendor', 'twrp', 'build', 'envsetup.sh'),
    '[ -s \\\"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\\\" ]',
    lines_to_insert_vendor,
    optional=True
)
