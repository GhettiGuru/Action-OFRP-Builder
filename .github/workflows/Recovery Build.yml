name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'twrp_nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT:
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore Android SDK Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/android-sdk
            /usr/local/lib/android
          key: android-sdk-${{ runner.os }}

      - name: Clean Preinstalled Tools
        run: |
          set -x
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Install Build Dependencies
        run: |
          set -x
          sudo apt update && sudo apt full-upgrade -y && sudo apt -y install \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk aria2 repo gh git

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set Up Workspace
        id: pwd
        run: |
          mkdir -p workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT

      - name: Restore OrangeFox .repo Cache
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}-
            ofrp-repo-

      - name: Sync OrangeFox sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          if [ ! -d fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo ]; then
            git clone ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} \
              --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          fi
          cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Patch envsetup.sh for unbound variables
        run: |
          sed -i 's/\bversion\b/${version:-unknown}/g' \
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build/envsetup.sh
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' \
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build/envsetup.sh

      - name: Save OrangeFox .repo Cache
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Tree (if defined)
        if: github.event.inputs.COMMON_TREE_URL != ''
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build Recovery Image
        run: |
          set -xeuo pipefail
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          touch build.log
          {
            set +u  # prevent unbound variable errors for version, etc.
            source build/envsetup.sh
            source vendor/twrp/build/envsetup.sh || true
            set -u

            export ALLOW_MISSING_DEPENDENCIES=true
            export OUT_DIR=$(pwd)/out
            export OUT=$OUT_DIR
            touch frameworks/base/services/core/xsd/vts/Android.mk

            echo "Running lunch..."
            lunch ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_VARIANT }} || { echo "Lunch failed!"; exit 1; }

            echo "TARGET_PRODUCT=$TARGET_PRODUCT"
            echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
            echo "TARGET_DEVICE=$TARGET_DEVICE"

            make -j$(nproc) recoveryimage
          } 2>&1 | tee build.log
        continue-on-error: true

      - name: Check output files
        run: |
          set -x
          ls -al workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product || true
          ls -al workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/* || true

      - name: Show build log (tail)
        run: |
          echo "::group::Last 100 lines of build.log"
          if [[ -f workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log ]]; then
            tail -n 100 workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log
          else
            echo "build.log not found!"
          fi
          echo "::endgroup::"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log

      - name: Upload Build Output
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
