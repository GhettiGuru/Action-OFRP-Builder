name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nxj729un'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (e.g. twrp_nx729j)'
        required: true
        default: 'twrp_nx729j'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Restore OrangeFox Source Cache
        id: orangefox-cache
        uses: actions/cache@v4
        with:
          path: |
            fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          key: orangefox-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ hashFiles('.github/workflows/**') }}

      - name: Restore Android SDK Cache
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/android-sdk
            /usr/local/lib/android
          key: android-sdk-${{ runner.os }}

      - name: Cleanup Preinstalled Tools to Free Space
        shell: bash
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Clean Workspace (SlimHub)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Up Workspace Directory
        id: pwd
        shell: bash
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

      - name: Prepare the Build Environment
        shell: bash
        run: |
          sudo apt update
          sudo apt -y install \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk aria2
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          sudo add-apt-repository universe -y
          sudo apt -y install libncurses5

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Sync OrangeFox sources and minimal manifest
        if: steps.orangefox-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone ${{ github.event.inputs.SYNC_URL }}
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Clone device tree
        shell: bash
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone common tree (if set)
        if: github.event.inputs.COMMON_TREE_URL != ''
        shell: bash
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Building Recovery
        shell: bash
        continue-on-error: true
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make clean
          mka ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all) | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exited with code $EXIT_CODE"
          echo "======== LOG TAIL ==========="
          tail -n 100 build.log
          exit $EXIT_CODE

      - name: Check Output Directory
        shell: bash
        run: |
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
          echo
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
