name: OrangeFox Recovery Build
on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git' # This input is likely redundant as orangefox_sync.sh hardcodes the manifest URL
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1' # REVERTED TO 12.1 as orangefox_sync.sh supports it
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      MAKEFILE_NAME: # Input #8
        description: 'MAKEFILE_NAME (e.g., twrp_nx729j or aosp_arm64)'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT: # Input #9
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'
      BUILD_TARGET: # Input #10 - Added for main workflow compatibility
        description: 'BUILD_TARGET (e.g., recovery, boot, vendor_boot)'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-24.04 # Still Ubuntu 24.04
    env:
      OF_VERSION: R12.1
      SYNC_URL: ${{ github.event.inputs.SYNC_URL }} # This will be ignored by orangefox_sync.sh
      MANIFEST_BRANCH: ${{ github.event.inputs.MANIFEST_BRANCH }}
      DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
      DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
      COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
      DEVICE_NAME: '' # Placeholder, will be derived
      MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
      BUILD_VARIANT: ${{ github.event.inputs.BUILD_VARIANT }}
      BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Initialize workspace
        id: pwd
        run: |
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
          
      - name: Derive DEVICE_NAME from MAKEFILE_NAME
        run: |
          DERIVED_DEVICE_NAME=$(echo "${{ env.MAKEFILE_NAME }}" | sed 's/^twrp_//')
          echo "Derived DEVICE_NAME: $DERIVED_DEVICE_NAME"
          echo "DEVICE_NAME=$DERIVED_DEVICE_NAME" >> $GITHUB_ENV

      - name: Prepare the build environment # This step clones misc/scripts to workspace/scripts
        run: |
          sudo snap remove firefox
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
              linux-modules-extra-$(uname -r) \
              git python3 tar aria2 git gh repo
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      
      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ env.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-
      
      - name: Sync OrangeFox Sources
        run: |
         cd ${{ steps.pwd.outputs.workspace-folder }}
         git clone ${{ github.event.inputs.SYNC_URL }}
         cd sync
         ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE_NAME }}-
      - name: Configure ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
      - name: Check & Free Disk Space
        run: |
          echo "📦 Disk usage BEFORE cleanup:"
          df -h /
          echo ""
          echo "🔍 Searching for .tzst repo cache archives in /home/runner/work/_temp..."
          ARCHIVES=$(find /home/runner/work/_temp -type f -name '*.tzst')
          if [ -z "$ARCHIVES" ]; then
            echo "✅ No .tzst repo cache archive found by this script — nothing to delete."
          else
            echo "🗑️ Found the following archive(s) to delete:"
            echo "$ARCHIVES"
            echo ""
            echo "$ARCHIVES" | xargs rm -f
            echo "✅ Deleted repo cache archive(s)."
          fi
          echo ""
          echo "📦 Disk usage AFTER cleanup (by this step):"
          df -h /

      - name: Clone device tree
        # The orangefox_sync.sh creates the fox_${{ env.MANIFEST_BRANCH }} directory.
        # So we need to cd into it from the workspace.
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          git clone ${{ env.DEVICE_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.DEVICE_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}

      - name: Clone common tree (if provided)
        if: ${{ env.COMMON_TREE_URL != '' && env.COMMON_PATH != '' }}
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          git clone ${{ env.COMMON_TREE_URL }} -b ${{ env.DEVICE_TREE_BRANCH }} ./${{ env.COMMON_PATH }}
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}

      - name: Debug envsetup.sh around line 722
        run: |
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          echo "Content of $BUILD_TOP_PATH/build/envsetup.sh around line 722:"
          sed -n '710,730p' "$BUILD_TOP_PATH/build/envsetup.sh"
          echo "--- End of envsetup.sh snippet ---"
        continue-on-error: true

      - name: Patch envsetup.sh for compatibility
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/build
          echo "🔧 Patching envsetup.sh"
          dos2unix envsetup.sh || true
          sed -i '/echo \[DEBUG\]/d' envsetup.sh || true
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' envsetup.sh || true
          
          # --- PATCH FOR 'version: unbound variable' (consolidated here) ---
          echo "Applying 'version=${variant}' patch to build/envsetup.sh..."
          sed -i '/^        fi$/a\        version=${variant}' envsetup.sh
          # --- END PATCH ---

      - name: Inject Debugging into envsetup.sh
        run: |
          set -x
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
          sed -i '/\[ -s "\$T\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: (build/envsetup.sh) Checking Android.mk:" >&2; \
          echo "DEBUG-INJECT: (build/envsetup.sh) CWD: $(pwd)" >&2; \
          echo "DEBUG-INJECT: (build/envsetup.sh) Path being checked: \$T/frameworks/base/services/core/xsd/vts/Android.mk" >&2; \
          ls -l \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Android.mk not found!" >&2; \
          echo "DEBUG-INJECT: (build/envsetup.sh) Result of -s check: $( [ -s \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
          "$BUILD_TOP_PATH/build/envsetup.sh"
          if [ -f "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh" ]; then
          sed -i '/\[ -s "\$TOP\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Checking Android.mk:" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) CWD: $(pwd)" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Path being checked: \$TOP/frameworks/base/services/core/xsd/vts/Android.mk" >&2; \
          ls -l \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Android.mk not found!" >&2; \
          echo "DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Result of -s check: $( [ -s \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
          "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh"
          fi

      - name: Building recovery
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
          
          touch build.log
          exec > >(tee -a build.log) 2>&1
          echo "Starting recovery build process..."
          set +e # Allow envsetup.sh to have non-fatal errors
          source build/envsetup.sh
          
          # --- PATCH START for 'version: unbound variable' ---
          # This patch ensures the 'local version' variable inside the lunch function
          # is assigned a value. The default parsing logic sometimes skips this assignment
          # if the variant name doesn't include a numeric version (e.g., "eng" vs "user-12.1").
          echo "Patching build/envsetup.sh to fix 'version: unbound variable' error..."
          # The 'a\' command in sed adds lines AFTER the pattern.
          # We target the 'fi' at the end of the variant parsing block in lunch().
          # The 'version' variable should be assigned the same value as 'variant' in these cases.
          # Note: The '        fi$' pattern requires 8 leading spaces to match the exact line.
          sed -i '/^        fi$/a\        version=${variant}' build/envsetup.sh
          # --- PATCH END ---
          source vendor/twrp/build/envsetup.sh || true # Use || true to prevent job failure if vendor/twrp/build/envsetup.sh is missing
          set -e # Re-enable strict error checking
          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR=$(pwd)/out
          export OUT=$OUT_DIR
          echo "Running lunch command: lunch ${{ env.MAKEFILE_NAME }}-${{ env.BUILD_VARIANT }}"
          lunch ${{ env.MAKEFILE_NAME }}-${{ env.BUILD_VARIANT }}
          if [ $? -ne 0 ]; then
            echo "Lunch command failed!"
            exit 1
          fi
          echo "Environment variables after lunch:"
          env | grep -E 'TARGET_PRODUCT|TARGET_BUILD_VARIANT|TARGET_DEVICE|OUT|TARGET_PLATFORM_VERSION|TARGET_BUILD_TYPE|version|DEVICE_NAME' 
          echo "Starting make clean && mka adbd ${BUILD_TARGET}image..."
          make clean && mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all)
          if [ $? -ne 0 ]; then
            echo "Make failed!"
            exit 1
          fi
          echo "Recovery image build completed."
        continue-on-error: true
      - name: Check the output directory before uploading
        run: |
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/
          echo
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/*/recovery.img 

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log-${{ env.DEVICE_NAME }}
          path: workspace/fox_${{ env.MANIFEST_BRANCH }}/build.log
      - name: Show ccache stats
        if: always()
        run: |
          echo "📦 ccache summary:"
          ccache -s || echo "⚠️ ccache not installed or failed"
      - name: Upload to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.img
            workspace/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Device: ${{ env.DEVICE_NAME }}
            Target: ${{ env.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('🧪 OrangeFox Recovery Build Summary')
              .addTable([
                ['Key', 'Value'],
                ['Device', process.env.DEVICE_NAME],
                ['Branch', process.env.MANIFEST_BRANCH],
                ['Target', process.env.BUILD_TARGET],
                ['Success', '${{ job.status }}'],
              ])
              .addLink('🔗 Download Artifacts', `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`)
              .write()
      - name: ✅ Done
        if: always()
        run: echo "Build process completed (success or fail). Check artifacts above."
