name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'twrp_nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT:
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clean Preinstalled Tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt full-upgrade -y && sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk \
            aria2 repo gh git dos2unix

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set Up Workspace
        id: pwd
        run: |
          mkdir -p workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT

      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-

      - name: Delete repo cache archive to free disk space
        if: steps.cache-ofrp.outputs.cache-hit == 'true'
        run: |
          echo "🔍 Searching for .tzst cache archives to delete..."
          ARCHIVES=$(find /home/runner/work/_temp -name '*.tzst')
          if [ -z "$ARCHIVES" ]; then
            echo "✅ No .tzst archive found — nothing to delete."
          else
            echo "🗑️ Found archive(s):"
            echo "$ARCHIVES"
            echo "$ARCHIVES" | xargs rm -f
            echo "✅ Deleted archive(s) to free up disk space."
          fi
          echo "📦 Disk usage after cleanup:"
          df -h /

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Set LUNCH_COMBO environment variable
        run: echo "LUNCH_COMBO=${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_VARIANT }}" >> $GITHUB_ENV

      - name: Conditionally Sync OrangeFox Sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}

          if [ -f fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo/manifest.xml ]; then
            echo "🟢 .repo cache found - using orangefox_sync.sh for resync"
            git clone --depth=1 ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ../fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "🔴 .repo cache NOT found - full repo init/sync"
            mkdir -p fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
            repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc)
          fi

      - name: Show .repo folder size
        run: du -sh workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo || echo "Repo folder not found"

      - name: Clone Device Tree
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Tree (if defined)
        if: github.event.inputs.COMMON_TREE_URL != ''
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

      - name: Patch envsetup.sh for compatibility
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build
          echo "🔧 Patching envsetup.sh"
          dos2unix envsetup.sh || true
          sed -i '/echo \[DEBUG\]/d' envsetup.sh || true
          sed -i 's/\bversion\b/${version:-unknown}/g' envsetup.sh || true
          sed -i 's/\bBUILD_VAR_CACHE_READY\b/${BUILD_VAR_CACHE_READY:-false}/g' envsetup.sh || true

      - name: Inject Debugging into envsetup.sh
        run: |
          set -x
          BUILD_TOP_PATH="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"

          sed -i '/\[ -s "\$T\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
          echo "DEBUG-INJECT: Checking Android.mk:" >&2; \
          echo "DEBUG-INJECT: CWD: $(pwd)" >&2; \
          ls -l \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Not found!" >&2; \
          echo "DEBUG-INJECT: Result: $( [ -s \"\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
          "$BUILD_TOP_PATH/build/envsetup.sh"

          if [ -f "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh" ]; then
            sed -i '/\[ -s "\$TOP\/frameworks\/base\/services\/core\/xsd\/vts\/Android.mk" \]/i\
            echo "DEBUG-INJECT: Checking Android.mk (vendor):" >&2; \
            echo "DEBUG-INJECT: CWD: $(pwd)" >&2; \
            ls -l \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >&2 || echo "Not found!" >&2; \
            echo "DEBUG-INJECT: Result: $( [ -s \"\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo TRUE || echo FALSE )" >&2;' \
            "$BUILD_TOP_PATH/vendor/twrp/build/envsetup.sh"
          fi

      - name: Build Recovery Image
        run: |
          set -xeuo pipefail
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

          exec > >(tee -a build.log) 2>&1

          echo "Starting recovery build..."
          set +u
          source build/envsetup.sh
          source vendor/twrp/build/envsetup.sh || true
          set -u

          export ALLOW_MISSING_DEPENDENCIES=true
          export OUT_DIR=$(pwd)/out
          export OUT=$OUT_DIR

          echo "Lunch: $LUNCH_COMBO"
          lunch $LUNCH_COMBO || exit 1

          env | grep -E 'TARGET_PRODUCT|TARGET_BUILD_VARIANT|TARGET_DEVICE|OUT'

          echo "Running make recoveryimage..."
          make -j$(nproc) recoveryimage || exit 1

          echo "✅ Recovery build completed."
        continue-on-error: true

      - name: Show ccache summary
        run: ccache -s

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery.img
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/*/recovery.img

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log

      - name: Upload Build Output
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            core.summary
              .addHeading('🧪 OrangeFox Recovery Build Summary')
              .addTable([
                ['Key', 'Value'],
                ['Device', process.env.DEVICE_NAME],
                ['Branch', process.env.MANIFEST_BRANCH],
                ['Success', '${{ job.status }}'],
              ])
              .addLink('🔗 Download Artifacts', '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
              .write()

      - name: ✅ Done
        if: always()
        run: echo "Build process completed (success or fail). Check artifacts above."
