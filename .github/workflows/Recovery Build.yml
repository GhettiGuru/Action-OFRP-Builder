          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}    inserted = False
        for line in content:
            # Check for the pattern. Using 'in' for simple substring match.
            # For more complex regex, import 're' and use re.search(pattern, line).
            if pattern in line and not inserted:
                # Insert lines before the pattern
                for insert_line in lines_to_insert:
                    # Ensure each inserted line ends with a newline character
                    new_content.append(insert_line.rstrip('\\n') + '\\n')
                inserted = True
            new_content.append(line)

        if not inserted:
            if optional:
                print(f\"Warning: Pattern '{pattern}' not found in optional file '{filepath}'. Lines not inserted.\", file=sys.stderr)
            else:
                print(f\"Error: Pattern '{pattern}' not found in '{filepath}'. Lines not inserted.\", file=sys.stderr)
                sys.exit(1) # Exit with error if pattern is mandatory and not found

        with open(filepath, 'w') as f:
            f.writelines(new_content)
        print(f\"Successfully injected lines into {filepath}\")

    except FileNotFoundError as e:
        print(f\"Error: {e}\", file=sys.stderr)
        sys.exit(1) # Exit with error if a mandatory file is not found
    except Exception as e:
        print(f\"An unexpected error occurred: {e}\", file=sys.stderr)
        sys.exit(1) # Exit with error for other exceptions

# Define the lines to insert for build/envsetup.sh
# Escaping for shell variables ($T, $(pwd)) is done here, as these strings
# will be written to the envsetup.sh file and then interpreted by the shell.
lines_to_insert_build = [
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Checking Android.mk:\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) CWD: \\$(pwd)\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Path being checked: \\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr',
    'ls -l \"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr || echo \"DEBUG-INJECT: (build/envsetup.sh) Android.mk not found or empty here!\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (build/envsetup.sh) Result of -s check: \\$( [ -s \"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo \"TRUE\" || echo \"FALSE\" )\" >> /dev/stderr'
]

# Define the lines to insert for vendor/twrp/build/envsetup.sh
lines_to_insert_vendor = [
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Checking Android.mk:\" >> /dev/stderr',
