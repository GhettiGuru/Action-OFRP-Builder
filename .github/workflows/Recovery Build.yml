name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nxj729un'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'twrp_nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_nx729j'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Restore Android SDK Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ~/android-sdk
            /usr/local/lib/android
          key: android-sdk-${{ runner.os }}

      - name: Cleanup Preinstalled Tools to Free Space
        shell: bash
        run: |
          set -x
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Clean Workspace (SlimHub)
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Up Workspace Directory
        id: pwd
        shell: bash
        run: |
          set -x
          mkdir workspace
          cd workspace
          echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

      - name: Prepare Build Environment
        shell: bash
        run: |
          set -x
          sudo apt update
          sudo apt -y install \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk aria2
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          sudo add-apt-repository universe -y
          sudo apt -y install libncurses5

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}
          git clone ${{ github.event.inputs.SYNC_URL }}
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Save OrangeFox Source Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          key: orangefox-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}

      - name: Clone Device Tree
        shell: bash
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Tree (if defined)
        if: github.event.inputs.COMMON_TREE_URL != ''
        shell: bash
        run: |
          set -x
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
