name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/GhettiGuru/Redmagic-8-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/nubia/nx729j'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (optional)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (optional)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'twrp_nx729j'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_nx729j'
      BUILD_VARIANT:
        description: 'Build variant (eng or userdebug)'
        required: true
        default: 'eng'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clean Preinstalled Tools
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' azure-cli google-cloud-sdk
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc ~/.cargo ~/.rustup

      - name: Install Build Dependencies
        run: |
          sudo apt update && sudo apt full-upgrade -y && sudo apt install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk \
            aria2 repo gh git dos2unix

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set Up Workspace
        id: pwd
        run: |
          mkdir -p workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT

      - name: Restore OrangeFox .repo Cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-repo-${{ github.event.inputs.MANIFEST_BRANCH }}
          restore-keys: |
            ofrp-repo-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.event.inputs.DEVICE_NAME }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=${{ github.workspace }}/.ccache
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G
          echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Delete repo cache archive to free disk space
        if: steps.restore-repo-cache.outputs.cache-hit == 'true'
        run: |
         echo "🔍 Looking for .tzst cache archives in /home/runner/work/_temp..."
         ARCHIVES=$(find /home/runner/work/_temp -name '*.tzst')

         if [ -z "$ARCHIVES" ]; then
         echo "✅ No .tzst archive found — nothing to delete."
         else
         echo "🗑️ Found archive(s):"
         echo "$ARCHIVES"
         echo "Deleting..."
         echo "$ARCHIVES" | xargs rm -f
         echo "✅ Deleted archive(s) to free up disk space."
         fi

         echo "📦 Disk usage after deletion:"
         df -h /

      - name: Conditionally Sync OrangeFox Sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}

          if [ -f fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo/manifest.xml ]; then
            echo "🟢 .repo cache found - using orangefox_sync.sh for resync"
            git clone --depth=1 ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ../fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "🔴 .repo cache NOT found - full repo init/sync"
            mkdir -p fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} || {
              echo "❌ Repo init failed - branch may not exist"
              exit 1
            }
            repo sync -c --no-tags --no-clone-bundle --force-sync -j$(nproc)
          fi

      - name: Patch envsetup.sh for compatibilityname: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
      LUNCH_COMBO:
        description: 'LUNCH_COMBO'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git aria2 python3 dos2unix

      - name: Setup workspace
        run: |
          mkdir -p workspace
          echo "BUILD_TOP_PATH=$(pwd)/workspace" >> $GITHUB_ENV

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: workspace/.ccache
          key: ccache-${{ github.event.inputs.LUNCH_COMBO }}-${{ hashFiles('**/*.mk', '**/*.sh') }}

      - name: Restore OrangeFox repo cache
        id: cache-ofrp
        uses: actions/cache@v4
        with:
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
          key: ofrp-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ hashFiles('.gitmodules') }}

      - name: Delete OrangeFox repo cache archive to free disk space
        if: steps.cache-ofrp.outputs.cache-hit == 'true'
        run: |
          echo "Freeing space by deleting cache archive..."
          find /home/runner/work/_temp -name 'cache.tzst' -exec rm -f {} +
          echo "Archive deleted."

      - name: Show available disk space before sync
        run: df -h

      - name: Sync OrangeFox source
        run: |
          cd workspace
          if [ -d "fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo" ]; then
            echo "🟢 .repo cache found - using orangefox_sync.sh"
            mkdir -p fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            cd fox_${{ github.event.inputs.MANIFEST_BRANCH }}
            git clone --depth=1 https://gitlab.com/OrangeFox/build/make.git -b fox_12.1 orangefox
            bash orangefox/orangefox_sync.sh --branch=${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "🔴 .repo cache NOT found - performing full repo init/sync"
            repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
            repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all)
          fi

      - name: Show .repo folder size
        run: du -sh workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo || echo "Repo folder not found"

      - name: Inject debug logging into envsetup scripts
        run: |
          python3 .github/scripts/inject_debug.py

      - name: Setup ccache environment
        run: |
          echo "CCACHE_DIR=$(pwd)/workspace/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV
          ccache -o compression=true
          ccache -z

      - name: Clone device tree
        run: |
          cd workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone --depth=1 ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Start build
        run: |
          set -xeuo pipefail
          cd workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          touch build.log
          echo 'TARGET_PLATFORM_VERSION := SP2A.220305.012' | tee -a build.log
          set +u
          source build/envsetup.sh
          source vendor/twrp/build/envsetup.sh || true
          lunch ${{ github.event.inputs.LUNCH_COMBO }}
          mka recoveryimage 2>&1 | tee -a build.log

        continue-on-error: true

      - name: Show ccache summary
        run: ccache -s

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery.img
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/*/recovery.img

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build.log
          path: workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build.log

      - name: Upload Build Output
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
