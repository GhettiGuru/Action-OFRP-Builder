name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox manifest branch (e.g. 12.1)'
        required: true
        default: '12.1'
      SYNC_URL:
        description: 'URL to OrangeFox sync repo'
        required: true
      DEVICE_NAME:
        description: 'Device codename (e.g. nx729j)'
        required: true
      DEVICE_PATH:
        description: 'Device tree path relative to source (e.g. device/nubia/nx729j)'
        required: true
      DEVICE_TREE_URL:
        description: 'URL to the device tree repo'
        required: true
      DEVICE_TREE_BRANCH:
        description: 'Branch for device tree'
        required: true
      COMMON_TREE_URL:
        description: 'URL to common tree (optional)'
        required: false
      COMMON_PATH:
        description: 'Path for common tree relative to source (optional)'
        required: false
      BUILD_TARGET:
        description: 'Build target (e.g. recovery, boot)'
        required: true
        default: 'recovery'
      MAKEFILE_NAME:
        description: 'Makefile product name (e.g. twrp_nx729j)'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            ~/.android
            ~/Android
          key: android-sdk-${{ runner.os }}-v1

      - name: Cache OrangeFox Sources
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/build
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/bootable
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/device
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/prebuilts
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/system
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/vendor
            ${{ github.workspace }}/workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/hardware
          key: ofrp-source-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ runner.os }}-v1
          restore-keys: |
            ofrp-source-${{ github.event.inputs.MANIFEST_BRANCH }}-
            ofrp-source-

      - name: Clean Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Up Workspace Directory
        run: |
          mkdir -p workspace
          echo "workspace-folder=$(pwd)/workspace" >> $GITHUB_OUTPUT
        id: pwd

      - name: Prepare the Build Environment
        run: |
          sudo apt update
          sudo apt -y install \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libtinfo5 libwxgtk3.0-gtk3-dev lzop pngcrush python-is-python3 \
            schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk aria2

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          sudo add-apt-repository universe -y
          sudo apt -y install libncurses5

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Sync OrangeFox Sources
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}
          if [ ! -d "fox_${{ github.event.inputs.MANIFEST_BRANCH }}/.repo" ]; then
            git clone ${{ github.event.inputs.SYNC_URL }} sync
            cd sync
            ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          else
            echo "OrangeFox source already cached and exists"
          fi

      - name: Clone Device Tree
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

      - name: Clone Common Tree (if set)
        if: ${{ github.event.inputs.COMMON_TREE_URL != '' }}
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build Recovery
        run: |
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make clean
          mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Check Output Directory
        run: |
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
          ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: ${{ github.event.inputs.DEVICE_NAME }}
            Target: ${{ github.event.inputs.BUILD_TARGET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
