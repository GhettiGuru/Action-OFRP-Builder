    'ls -l \"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" >> /dev/stderr || echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Android.mk not found or empty here!\" >> /dev/stderr',
    'echo \"DEBUG-INJECT: (vendor/twrp/build/envsetup.sh) Result of -s check: \\$( [ -s \"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ] && echo \"TRUE\" || echo \"FALSE\" )\" >> /dev/stderr'
]

# Get BUILD_TOP_PATH from environment variable set by the shell
build_top_path = os.environ.get('BUILD_TOP_PATH')
if not build_top_path:
    print(\"Error: BUILD_TOP_PATH environment variable not set.\", file=sys.stderr)
    sys.exit(1)

# Call the function for build/envsetup.sh
insert_lines_before_pattern(
    os.path.join(build_top_path, 'build', 'envsetup.sh'),
    '[ -s \"\\$T/frameworks/base/services/core/xsd/vts/Android.mk\" ]',
    lines_to_insert_build
)

# Call the function for vendor/twrp/build/envsetup.sh
# This one is optional, so we pass optional=True
insert_lines_before_pattern(
    os.path.join(build_top_path, 'vendor', 'twrp', 'build', 'envsetup.sh'),
    '[ -s \"\\$TOP/frameworks/base/services/core/xsd/vts/Android.mk\" ]',
    lines_to_insert_vendor,
    optional=True # Corresponds to the || true in the original shell command
)
